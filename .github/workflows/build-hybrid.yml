name: Build WildRig Hybrid

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-hybrid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest WildRig release
        id: wildrig
        shell: bash
        run: |
          VERSION="$(curl -fsSL https://api.github.com/repos/andru-kun/wildrig-multi/releases/latest | jq -r '.tag_name')"
          test -n "$VERSION"
          test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Hybrid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hybrid
          push: true
          build-args: |
            WILDRIG_VERSION=${{ steps.wildrig.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:hybrid
            ghcr.io/${{ github.repository }}:hybrid-${{ steps.wildrig.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
