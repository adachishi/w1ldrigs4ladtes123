name: Build WildRig AMD

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-amd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest WildRig release
        id: wildrig
        shell: bash
        run: |
          VERSION="$(curl -fsSL https://api.github.com/repos/andru-kun/wildrig-multi/releases/latest | jq -r '.tag_name')"
          test -n "$VERSION"
          test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest WildRig: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.amd
          push: true
          build-args: |
            WILDRIG_VERSION=${{ steps.wildrig.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:amd
            ghcr.io/${{ github.repository }}:amd-${{ steps.wildrig.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
